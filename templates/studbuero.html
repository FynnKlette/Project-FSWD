<!DOCTYPE html>
<html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personalbereich</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
<div class="container my-5" style="max-width: 500px;">

 
 <h1 class="text-center">Personalbereich</h1>
 
 {% with messages = get_flashed_messages(category_filter=["s_danger"]) %}
    {% for message in messages %}
      <div style="color: white; background-color: #ff4d4d; padding: 7px; margin-bottom: 15px; border-radius: 5px;">
        {{ message }}
      </div>
    {% endfor %}
 {% endwith %}

<div class="card shadow-sm p-4 mb-4 bg-white rounded">
  <form action="/slog" method="POST">
    <div class="mb-3">


 <label class="form-label">MA-ID</label>
     <input
        type="text"
        name="email"
        placeholder="MA-ID"
        class="form-control"
        required>
    </div>
 
   <div class="mb-3">
    <label class="form-label">Email</label>
    <input
        type="text"
        name="email"
        placeholder="Email"
        class="form-control"
        required>

        <div class="mb-3">
    <label class="form-label">Passwort</label>
    <input
        type="password"
        name="password"
        placeholder="Passwort"
        class="form-control"
        required>

    </div>

    
    

    
<button type="submit" class="btn text-white w-100" style="background-color: #ee1111; border-color: #ee1111;">Anmelden</button>
    
</form>

</body>
</html>
